name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtualenv and install deps
        run: |
          uv venv --python 3.12
          uv pip install -r api/engine/requirements.txt pytest pytest-asyncio

      - name: Run engine tests
        run: uv run pytest tests/engine -q
