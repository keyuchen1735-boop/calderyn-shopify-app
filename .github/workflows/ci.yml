name: CI

on:
  push:
  pull_request:

jobs:
  node:
    name: Node gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  python:
    name: Python engine tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: calderyn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Loopback test DB — the engine suite refuses any non-local host
      # (tests/engine/conftest.py) so it can never touch a shared database.
      TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/calderyn_test
      # The pipeline test (test_pipeline_writes_grades) calls run_for_shop ->
      # load_config(), which requires DATABASE_URL. Point it at the same loopback
      # test DB. conftest pools still use ONLY TEST_DATABASE_URL, so nothing can
      # reach a shared database.
      DATABASE_URL: postgres://postgres:test@localhost:5432/calderyn_test
    steps:
      - uses: actions/checkout@v4

      - name: Create Supabase parity roles + apply engine schema
        env:
          PGPASSWORD: test
        run: |
          # The postgres service is a container; psql must exist on the runner.
          command -v psql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends postgresql-client
          }
          psql -h localhost -U postgres -d calderyn_test -v ON_ERROR_STOP=1 \
            -f tests/engine/schema/000_roles.sql
          for f in tests/engine/schema/migrations/*.sql; do
            psql -h localhost -U postgres -d calderyn_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtualenv and install deps
        run: |
          uv venv --python 3.12
          uv pip install -r api/engine/requirements.txt pytest pytest-asyncio

      - name: Run engine tests
        run: uv run pytest tests/engine -q
